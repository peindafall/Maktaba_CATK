services:
  db:
    image: postgres:16-alpine
    container_name: maktaba_db
    environment:
      POSTGRES_DB: maktaba_catk
      POSTGRES_USER: maktaba_user
      POSTGRES_PASSWORD: maktaba_password_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maktaba_user -d maktaba_catk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis:
    image: redis:7-alpine
    container_name: maktaba_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  minio:
    image: minio/minio:latest
    container_name: maktaba_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: maktaba_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8080:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "deb.debian.org:199.232.170.132"
      - "security.debian.org:151.101.194.132"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: maktaba_celery_worker
    command: celery -A config worker -l info -Q default,high_priority
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "deb.debian.org:199.232.170.132"
      - "security.debian.org:151.101.194.132"

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: maktaba_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "deb.debian.org:199.232.170.132"
      - "security.debian.org:151.101.194.132"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: maktaba_frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  nginx:
    image: nginx:1.27-alpine
    container_name: maktaba_nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - media_data:/var/www/media:ro
    ports:
      - "8001:80"
    depends_on:
      - backend
      - frontend
    networks:
      - maktaba_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:

networks:
  maktaba_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500