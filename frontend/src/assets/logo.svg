<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1EA478;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#114D0D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF8B28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A67723;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book icon -->
  <rect x="8" y="10" width="32" height="40" rx="3" fill="url(#grad1)" />
  <rect x="12" y="14" width="24" height="2" rx="1" fill="#FEFBA4" opacity="0.8"/>
  <rect x="12" y="20" width="24" height="2" rx="1" fill="#FEFBA4" opacity="0.6"/>
  <rect x="12" y="26" width="18" height="2" rx="1" fill="#FEFBA4" opacity="0.6"/>
  <!-- Star/crescent accent -->
  <circle cx="30" cy="36" r="5" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="32" cy="34" r="3.5" fill="url(#grad1)"/>
  <!-- Text: Maktaba -->
  <text x="50" y="28" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="url(#grad1)">Maktaba</text>
  <!-- Text: CATK -->
  <text x="50" y="46" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="url(#goldGrad)">CATK</text>
</svg>
