events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  gzip on;
  gzip_vary on;
  gzip_types text/plain application/json application/javascript text/css;
  
  upstream django {
    server backend:8000;
    keepalive 32;
  }
  
  # HTTP redirect to HTTPS
  server {
    listen 80;
    server_name catk.org www.catk.org;
    return 301 https://$host$request_uri;
  }
  
  server {
    listen 443 ssl http2;
    server_name catk.org www.catk.org;
    client_max_body_size 100M;
    
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src https://www.youtube.com" always;
    
    # API
    location /api/ {
      proxy_pass http://django;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 60s;
      proxy_read_timeout 120s;
    }
    
    location /admin/ {
      proxy_pass http://django;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Static files
    location /static/ {
      alias /var/www/static/;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
      alias /var/www/media/;
      expires 7d;
    }
    
    # React SPA
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
