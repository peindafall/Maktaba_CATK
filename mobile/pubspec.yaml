name: maktaba_catk
description: Bibliothèque numérique des enseignements du Professeur Cheikh Ahmet Tidiane KEBE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # Network
  dio: ^5.4.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Media
  audioplayers: ^6.0.0
  youtube_player_iframe: ^5.2.0
  flutter_pdfview: ^1.3.2

  # Storage helpers
  path_provider: ^2.1.2

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.6
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
